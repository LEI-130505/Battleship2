# 129857 - Rui Fernandes
name: Qodana smell gate 129857
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    name: Qodana gate 129857
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129857.yaml
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-annotations: true
          post-pr-comment: true

# 129835 - Afonso da Cota Bonito
name: Qodana smell gate 129835
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Usar a configuracao Qodana 129835
        run: cp qodana-129835.yaml qodana.yaml
      - uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

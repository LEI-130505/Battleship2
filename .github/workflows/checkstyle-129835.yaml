# 129835 - Afonso da Cota Bonito
name: Checkstyle gate 129835
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    name: Checkstyle gate 129835
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v4.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: Checkstyle/checkstyle-129835.xml
          reporter: github-pr-check
          filter_mode: nofilter
          level: error
          fail_level: error

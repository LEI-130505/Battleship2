# 129767 - João Teixeira
name: Checkstyle gate 129767
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: Checkstyle/checkstyle-129767.xml
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_level: any